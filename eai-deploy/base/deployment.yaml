apiVersion: apps/v1
kind: Deployment
metadata:
  name: eai-person-app
  labels:
    app: eai-person-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eai-person-app
  template:
    metadata:
      labels:
        app: eai-person-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: app
          image: eai-person-app   # tag set per environment in the overlay (images:)
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eai-person-app-config
            - secretRef:
                name: eai-person-app-secret
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
