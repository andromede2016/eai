apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eai-person-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/andromede2016/eai.git
    targetRevision: main
    path: eai-deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: eai-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
