# Standalone Artemis broker for the default (native) profile.
# docker compose up -d   -> console: http://localhost:8161/console (artemis / artemis)
services:
  artemis:
    image: apache/activemq-artemis:2.41.0
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
    healthcheck:
      test: ["CMD-SHELL", "/var/lib/artemis-instance/bin/artemis queue stat --user artemis --password artemis --url tcp://localhost:61616 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # PostgreSQL database for the PERSON table (schema created by the app from schema.sql).
  # psql: docker compose exec postgres psql -U eai -d persondb
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: persondb
      POSTGRES_USER: eai
      POSTGRES_PASSWORD: eai
    volumes:
      - postgres-data:/var/lib/postgresql/data   # survives 'docker compose down'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eai -d persondb"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Web UI to browse the database: http://localhost:8091
  # Login: System=PostgreSQL, Server=postgres, Username=eai, Password=eai, Database=persondb
  adminer:
    image: adminer:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8091:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # One-shot job: pre-creates durable queues so they exist (and survive) without any client connected.
  artemis-init:
    image: apache/activemq-artemis:2.41.0
    depends_on:
      artemis:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for q in PERSON.IN PERSON.OUT PERSON.DLQ; do
          /opt/activemq-artemis/bin/artemis queue create --url tcp://artemis:61616 \
            --user artemis --password artemis --name "$$q" --address "$$q" \
            --anycast --durable --auto-create-address --preserve-on-no-consumers --silent \
            && echo "queue $$q created" || echo "queue $$q already exists"
        done

  # Single-node Kafka in KRaft mode (no ZooKeeper). Clients on the host use localhost:9092,
  # containers use kafka:29092.
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # ---- disk protection (broker defaults for every topic, can be overridden per topic)
      # A partition log is split into segment files; only CLOSED segments are deleted.
      KAFKA_LOG_SEGMENT_BYTES: 67108864          # 64 MB per segment (default 1 GB: too coarse for a small disk)
      KAFKA_LOG_RETENTION_HOURS: 168             # delete segments older than 7 days...
      KAFKA_LOG_RETENTION_BYTES: 536870912       # ...or when a PARTITION exceeds 512 MB (whichever comes first)
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
      KAFKA_MESSAGE_MAX_BYTES: 1048576           # reject records > 1 MB
    volumes:
      - kafka-data:/var/lib/kafka/data   # survives 'docker compose down' (deleted only by 'down -v')
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot job: creates the topics (3 partitions -> up to 3 parallel consumers in one group).
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in person.in person.out person.dlt; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1 && echo "topic $$t ready"
        done

  # Web UI to browse topics, partitions, offsets, consumer groups: http://localhost:8090
  kafka-ui:
    image: kafbat/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  kafka-data:
  postgres-data:
