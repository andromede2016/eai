spring:
  application:
    name: eai-person-app
  artemis:
    mode: native
    broker-url: ${ARTEMIS_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:}
    password: ${ARTEMIS_PASSWORD:}
  datasource:
    # PostgreSQL from docker-compose (service 'postgres'). The 'local' profile switches back to H2.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/persondb}
    username: ${DB_USER:eai}
    password: ${DB_PASSWORD:eai}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}   # >= JMS max concurrency (5) + Kafka concurrency (3)
      connection-timeout: 10000               # fail after 10 s if no connection is available
  sql:
    init:
      mode: always   # runs classpath:schema.sql at startup (CREATE TABLE IF NOT EXISTS)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # where a NEW consumer group starts: earliest = from the beginning of the topic, latest = only new records
      auto-offset-reset: earliest
      enable-auto-commit: false   # offsets committed by the Spring container after each record
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      acks: all                   # wait for all in-sync replicas (durability)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true  # no duplicates on producer retries

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    # INFO = message lifecycle trace ; DEBUG = + payloads and body content
    com.eai.framework.engine: ${EAI_TRACE_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

eai:
  inbound:
    name: jms-person
    queue: PERSON.IN
    concurrency: 1-5
    input-format: xml
  output:
    format: object
    channel: db
    destination: PERSON
  dead-letter-queue: PERSON.DLQ
  jms-output-queue: PERSON.OUT   # default queue for eai_output_channel=jms
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    name: kafka-person
    input-topic: person.in
    group-id: eai-person-app
    concurrency: 3            # = partitions of person.in
    input-format: json
    output-topic: person.out
    dead-letter-topic: person.dlt
